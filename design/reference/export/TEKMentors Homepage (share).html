document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 AI UPSKILLING<\u002Fdiv>\n        <h1 style=\"font-size:clamp(34px,4.3vw,74px);line-height:1.05;font-weight:700;letter-spacing:-0.028em;margin:0 0 26px;text-wrap:pretty\">We build the AI systems, and the people who keep them running.<\u002Fh1>\n        <p style=\"font-size:19px;line-height:1.6;color:#B3C6D3;max-width:580px;margin:0 0 36px;text-wrap:pretty\">Twenty years inside enterprise transformation, a fair few of them rescuing the ones that went sideways. We modernize the systems, get AI into production, and train your team to run it once we leave.<\u002Fp>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap;align-items:center\">\n          <a href=\"#contact\" style=\"background:#4FA8E4;color:#07253C;padding:16px 32px;border-radius:9px;font-weight:700;font-size:16px\" style-hover=\"background:#fff\">Talk to a consultant<\u002Fa>\n          <a href=\"#programs\" style=\"border:1px solid rgba(255,255,255,0.32);color:#fff;padding:15px 30px;border-radius:9px;font-weight:600;font-size:16px\" style-hover=\"border-color:#8CCB72;color:#8CCB72\">See the AI programs<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.14);border-radius:14px;padding:28px 30px;backdrop-filter:blur(6px)\">\n        <div style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#8CCB72;margin-bottom:18px\">START WHERE IT HURTS<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\">\n          <a href=\"#consulting\" style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 0;border-top:1px solid rgba(255,255,255,0.12);color:#fff;font-size:15.5px;font-weight:500\" style-hover=\"color:#4FA8E4\"><span>A pilot that works but will not go live<\u002Fspan><span style=\"font-size:17px\">→<\u002Fspan><\u002Fa>\n          <a href=\"#consulting\" style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;padd <\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:30px;font-weight:700\">Hands-on<\u002Fdiv><div style=\"font-size:13.5px;color:#7E9AAB;margin-top:4px\">Practitioner led. No theory decks.<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:30px;font-weight:700\">End-to-end<\u002Fdiv><div style=\"font-size:13.5px;color:#7E9AAB;margin-top:4px\">Discovery to production, then handover<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Clients\" style=\"border-bottom:1px solid #DCE5EB;background:#EEF2F5\">\n  <div style=\"max-width:1480px;margin:0 auto;padding:24px 32px;display:flex;align-items:center;gap:36px;flex-wrap:wrap\">\n    <span style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#566774;white-space:nowrap\">TEAMS WE HAVE WORKED WITH<\u002Fspan>\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;flex:1\"><div style=\"border:1px dashed #C4D2DC;border-radius:8px;height:40px;flex:1;min-width:106px;display:flex;align-items:center;justify-content:center;font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:#8FA0AC\">IBM<\u002Fdiv><div style=\"border:1px dashed #C4D2DC;border-radius:8px;height:40px;flex:1;min-width:106px;display:flex;align-items:center;justify-content:center;font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:#8FA0AC\">L&amp;T<\u002Fdiv><div style=\"border:1px dashed #C4D2DC;border-radius:8px;height:40px;flex:1;min-width:106px;display:flex;align-items:center;justify-content:center;font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:#8FA0AC\">CLIENT 3<\u002Fdiv><div style=\"border:1px dashed #C4D2DC;border-radius:8px;height:40px;flex:1;min-width:106px;display:flex;align-items:center;justify-content:center;font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:#8FA0AC\">CLIENT 4<\u002Fdiv><div style=\"border:1px dashed #C4D2DC;border-radius:8px;height:40px;flex:1;min-width:106px;display:flex;align-items:center;justify-content:center;font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:#8FA0AC\">CLIENT 5<\u002Fdiv><div style=\"border:1px dashed #C4D2DC;border-radius:8px;height:40px;flex:1;min-width:106px;display:flex;align-items:center;justify-content:center;font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:#8FA0AC\">CLIENT 6<\u002Fdiv><div style=\"border:1px dashed #C4D2DC;border-radius:8px;height:40px;flex:1;min-width:106px;display:flex;align-items:center;justify-content:center;font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:#8FA0AC\">CLIENT 7<\u002Fdiv><div style=\"border:1px dashed #C4D2DC;border-radius:8px;height:40px;flex:1;min-width:106px;display:flex;align-items:center;justify-content:center;font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:#8FA0AC\">CLIENT 8<\u002Fdiv><div style=\"border:1px dashed #C4D2DC;border-radius:8px;height:40px;flex:1;min-width:106px;display:flex;align-items:center;justify-content:center;font-family:'Spline Sans Mono',monospace;font-size:9.5px;letter-spacing:0.1em;color:#8FA0AC\">CLIENT 9<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"routes\" data-screen-label=\"Who this is for\" style=\"max-width:1480px;margin:0 auto;padding:clamp(48px,7vw,88px) clamp(18px,3vw,32px) 24px\">\n  <div style=\"max-width:700px;margin-bottom:40px\">\n    <div style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:0.14em;color:#1B7CBE;margin-bottom:16px\">WHO WRITES TO US<\u002Fdiv>\n    <h2 style=\"font-size:clamp(30px,3.6vw,46px);font-weight:700;letter-spacing:-0.025em;line-height:1.08;margin:0;text-wrap:pretty\">Three kinds of people land here. Pick yours and skip the rest.<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px\">\n    <div style=\"background:#fff;border:1px solid #DCE5EB;border-radius:14px;padding:32px 30px;display:flex;flex-direction:column\">\n      <div style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#687987;margin-bottom:16px\">01 · TECHNOLOGY LEADERS<\u002Fdiv>\n      <h3 style=\"font-size:21px;font-weight:700;letter-spacing:-0.015em;margin:0 0 12px\">Something is not shipping<\u002Fh3>\n      <p style=\"font-size:15px;line-height:1.6;color:#4C5C69;margin:0 0 20px;text-wrap:pretty\">A pilot stuck short of production, a migration that stalled, a bill that grew. You want an engineer's read before you commit more budget.<\u002Fp>\n      <div style=\"font-size:14px;color:#24404F;line-height:1.7;border-top:1px solid #E7EDF2;padding-top:16px;margin-bottom:20px\"><strong style=\"font-weight:600\">First step<\u002Fstrong><br>A 45 minute scoping session and a one page recommendation.<\u002Fdiv>\n      <a href=\"#consulting\" style=\"margin-top:auto;align-self:flex-start;background:#EAF4FB;color:#175F91;border:1px solid #CFE4F3;padding:11px 20px;border-radius:8px;font-size:14.5px;font-weight:600\" style-hover=\"background:#1B7CBE;color:#fff;border-color:#1B7CBE\">Consulting →<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DCE5EB;border-radius:14px;padding:32px 30px;display:flex;flex-direction:column\">\n      <div style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#687987;margin-bottom:16px\">02 · ENGINEERING AND L&amp;D HEADS<\u002Fdiv>\n      <h3 style=\"font-size:21px;font-weight:700;letter-spacing:-0.015em;margin:0 0 12px\">Your team has to become AI capable<\u002Fh3>\n      <p style=\"font-size:15px;line-height:1.6;color:#4C5C69;margin:0 0 20px;text-wrap:pretty\">You would rather train the engineers who already know your systems than hire strangers, and you need a program that ends in shipped work.<\u002Fp>\n      <div style=\"font-size:14px;color:#24404F;line-height:1.7;border-top:1px solid #E7EDF2;padding-top:16px;margin-bottom:20px\"><strong style=\"font-weight:600\">First step<\u002Fstrong><br>A skills read across the team, then a private cohort plan.<\u002Fdiv>\n      <a href=\"#program-fde\" style=\"margin-top:auto;align-self:flex-start;background:#EAF4FB;color:#175F91;border:1px solid #CFE4F3;padding:11px 20px;border-radius:8px;font-size:14.5px;font-weight:600\" style-hover=\"background:#1B7CBE;color:#fff;border-color:#1B7CBE\">Team programs →<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #DCE5EB;border-radius:14px;padding:32px 30px;display:flex;flex-direction:column\">\n      <div style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#687987;margin-bottom:16px\">03 · INDIVIDUAL ENGINEERS<\u002Fdiv>\n      <h3 style=\"font-size:21px;font-weight:700;letter-spacing:-0.015em;margin:0 0 12px\">You want the AI job, not the AI course<\u002Fh3>\n      <p style=\"font-size:15px;line-height:1.6;color:#4C5C69;margin:0 0 20px;text-wrap:pretty\">A few years in, or just out of college. You want to finish with work you can show and defend in an interview, and someone to help you get in the room.<\u002Fp>\n      <div style=\"font-size:14px;color:#24404F;line-height:1.7;border-top:1px solid #E7EDF2;padding-top:16px;margin-bottom:20px\"><strong style=\"font-weight:600\">First step<\u002Fstrong><br>A fifteen minute call to pick the right program and batch.<\u002Fdiv>\n      <a href=\"#program-genai\" style=\"margin-top:auto;align-self:flex-start;background:#EAF4FB;color:#175F91;border:1px solid #CFE4F3;padding:11px 20px;border-radius:8px;font-size:14.5px;font-weight:600\" style-hover=\"background:#1B7CBE;color:#fff;border-color:#1B7CBE\">Individual programs →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"programs\" data-screen-label=\"Programs\" style=\"max-width:1480px;margin:0 auto;padding:80px 32px 24px;scroll-margin-top:90px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:40px;flex-wrap:wrap;margin-bottom:36px\">\n    <div style=\"max-width:640px\">\n      <div style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:0.14em;color:#1B7CBE;margin-bottom:16px\">AI PROGRAMS<\u002Fdiv>\n      <h2 style=\"font-size:clamp(30px,3.6vw,46px);font-weight:700;letter-spacing:-0.025em;line-height:1.08;margin:0;text-wrap:pretty\">Three programs, with the details you would ask for anyway.<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:15.5px;line-height:1.6;color:#4C5C69;max-width:320px;margin:0;text-wrap:pretty\">All run live, taught by people who still do the work. Dates and fees come back with your enquiry.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"border-top:1px solid #10222E\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:24px;padding:12px 24px;border-bottom:1px solid #DCE5EB;font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#687987\">\n      <span>PROGRAM<\u002Fspan><span>WHO IT IS FOR<\u002Fspan><span>LENGTH<\u002Fspan><span>FORMAT<\u002Fspan><span><\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"program-fde\" style=\"scroll-margin-top:100px;background:#07253C;color:#fff;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:24px;padding:32px 24px;align-items:start;border-radius:0 0 14px 14px\">\n      <div>\n        <div style=\"font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#8CCB72;margin-bottom:10px\">FLAGSHIP · ENROLLING<\u002Fdiv>\n        <div style=\"font-size:26px;font-weight:700;letter-spacing:-0.02em;line-height:1.12;margin-bottom:12px\">AI Forward Deployed Engineer<\u002Fdiv>\n        <p style=\"font-size:14.5px;line-height:1.6;color:#A7BDCB;margin:0;max-width:440px;text-wrap:pretty\">LLM, RAG and agentic engineering on one real enterprise problem, with evaluation, security and governance in the build. Plus the customer-facing half of the job: discovery calls, design reviews, and briefing an executive who has eight minutes. Ends with a live system and a panel viva.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.55;color:#D5E2EA\">Engineers with 3 to 8 years behind them, individually or as a company cohort<\u002Fdiv>\n      <div style=\"font-size:14.5px;color:#D5E2EA\">6 to 8 weeks<\u002Fdiv>\n      <div style=\"font-size:14.5px;color:#D5E2EA\">Live, project led<\u002Fdiv>\n      <a href=\"#contact\" style=\"background:#4FA8E4;color:#07253C;padding:12px 18px;border-radius:8px;font-size:14px;font-weight:700;white-space:nowrap;text-align:center\" style-hover=\"background:#fff\">Enquire<\u002Fa>\n    <\u002Fdiv>\n    <div id=\"program-genai\" style=\"scroll-margin-top:100px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:24px;padding:32px 24px;align-items:start;border-bottom:1px solid #DCE5EB\">\n      <div>\n        <div style=\"font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#175F91;margin-bottom:10px\">JOB READY<\u002Fdiv>\n        <div style=\"font-size:23px;font-weight:700;letter-spacing:-0.015em;line-height:1.15;margin-bottom:12px\">GenAI engineering: foundations to production<\u002Fdiv>\n        <p style=\"font-size:14.5px;line-height:1.6;color:#4C5C69;margin:0;max-width:440px;text-wrap:pretty\">A RAG assistant, an MCP-enabled agent and a multimodal pipeline, each one deployed rather than simulated in a notebook. Ends with mock interviews, an industry panel viva, placement support and a capstone you can walk someone through line by line.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.55;color:#4C5C69\">Engineering graduates, no AI background needed<\u002Fdiv>\n      <div style=\"font-size:14.5px;color:#4C5C69\">16 weeks<br><span style=\"color:#687987;font-size:13px\">144 hours<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:14.5px;color:#4C5C69\">Live, 60% labs<\u002Fdiv>\n      <a href=\"https://www.tekmentors.com/genai-training-program/\" style=\"border:1.5px solid #10222E;color:#10222E;padding:11px 18px;border-radius:8px;font-size:14px;font-weight:600;white-space:nowrap;text-align:center\" style-hover=\"background:#10222E;color:#fff\">Syllabus<\u002Fa>\n    <\u002Fdiv>\n    <div id=\"program-leaders\" style=\"scroll-margin-top:100px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:24px;padding:32px 24px;align-items:start;border-bottom:1px solid #DCE5EB\">\n      <div>\n        <div style=\"font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#35702B;margin-bottom:10px\">NO CODE REQUIRED<\u002Fdiv>\n        <div style=\"font-size:23px;font-weight:700;letter-spacing:-0.015em;line-height:1.15;margin-bottom:12px\">AI-enabled agile and product leadership<\u002Fdiv>\n        <p style=\"font-size:14.5px;line-height:1.6;color:#4C5C69;margin:0;max-width:440px;text-wrap:pretty\">For Scrum Masters, Product Owners and delivery leads. Enough AI to back the right idea, question the wrong one, and stop nodding along in vendor meetings. Ends with your own team showing what they built.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.55;color:#4C5C69\">Agile and product leaders, run privately for a single team<\u002Fdiv>\n      <div style=\"font-size:14.5px;color:#4C5C69\">2 days<\u002Fdiv>\n      <div style=\"font-size:14.5px;color:#4C5C69\">Live online<\u002Fdiv>\n      <a href=\"#contact\" style=\"border:1.5px solid #10222E;color:#10222E;padding:11px 18px;border-radius:8px;font-size:14px;font-weight:600;white-space:nowrap;text-align:center\" style-hover=\"background:#10222E;color:#fff\">Book<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:20px 24px;border-bottom:1px solid #DCE5EB;font-size:14.5px;color:#4C5C69\">\n      <span style=\"font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:#687987\">ALSO RUNNING<\u002Fspan>\n      <a href=\"https://www.tekmentors.com/full-stack-architect/\" style=\"color:#24404F;border-bottom:1px solid #C4D2DC\" style-hover=\"color:#1B7CBE\">Full stack architect<\u002Fa>\n      <a href=\"https://www.tekmentors.com/devops-engineer-training-program/\" style=\"color:#24404F;border-bottom:1px solid #C4D2DC\" style-hover=\"color:#1B7CBE\">DevOps engineer<\u002Fa>\n      <a href=\"https://www.tekmentors.com/corporate-training-program-for-adobe-toolset/\" style=\"color:#24404F;border-bottom:1px solid #C4D2DC\" style-hover=\"color:#1B7CBE\">Adobe toolset, for corporate teams<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"consulting\" data-screen-label=\"Consulting\" style=\"max-width:1480px;margin:0 auto;padding:clamp(48px,7vw,88px) clamp(18px,3vw,32px) 24px;scroll-margin-top:90px\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:40px 64px;align-items:end;margin-bottom:44px\">\n    <div>\n      <div style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:0.14em;color:#1B7CBE;margin-bottom:16px\">CONSULTING<\u002Fdiv>\n      <h2 style=\"font-size:clamp(30px,3.6vw,46px);font-weight:700;letter-spacing:-0.025em;line-height:1.08;margin:0;text-wrap:pretty\">The gap is never the model. It is everything around it.<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:16.5px;line-height:1.6;color:#4C5C69;margin:0;max-width:520px;text-wrap:pretty\">Most AI pilots we are shown work perfectly and will never go live. Here is what that usually looks like, and what we replace it with.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px;margin-bottom:56px\">\n    <div style=\"background:#fff;border:1px solid #DCE5EB;border-radius:14px;padding:32px 30px\">\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:8px\">\n        <span style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#B4472F;font-weight:500\">BEFORE<\u002Fspan><span style=\"height:1px;flex:1;background:#E7EDF2\"><\u002Fspan>\n      <\u002Fdiv>\n      <h3 style=\"font-size:20px;font-weight:700;margin:0 0 22px;letter-spacing:-0.01em\">Disconnected pilots<\u002Fh3>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"border:1px dashed #DCC3B9;background:#FCF7F5;border-radius:10px;padding:14px 16px\"><div style=\"font-size:15px;font-weight:600\">Notebook prototype<\u002Fdiv><div style=\"font-size:13.5px;color:#8A6C62;margin-top:3px\">Runs on one laptop. No owner after the demo.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px dashed #DCC3B9;background:#FCF7F5;border-radius:10px;padding:14px 16px\"><div style=\"font-size:15px;font-weight:600\">Data pulled by hand<\u002Fdiv><div style=\"font-size:13.5px;color:#8A6C62;margin-top:3px\">Exports and spreadsheets. Nothing repeatable.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px dashed #DCC3B9;background:#FCF7F5;border-radius:10px;padding:14px 16px\"><div style=\"font-size:15px;font-weight:600\">Quality judged by vibes<\u002Fdiv><div style=\"font-size:13.5px;color:#8A6C62;margin-top:3px\">No eval set, so no way to prove it improved.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px dashed #DCC3B9;background:#FCF7F5;border-radius:10px;padding:14px 16px\"><div style=\"font-size:15px;font-weight:600\">Security consulted last<\u002Fdiv><div style=\"font-size:13.5px;color:#8A6C62;margin-top:3px\">Review arrives after the build, and blocks it.<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px dashed #DCC3B9;background:#FCF7F5;border-radius:10px;padding:14px 16px\"><div style=\"font-size:15px;font-weight:600\">No path to production<\u002Fdiv><div style=\"font-size:13.5px;color:#8A6C62;margin-top:3px\">The pilot succeeds. The rollout never starts.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#07253C;color:#fff;border-radius:14px;padding:32px 30px;position:relative;overflow:hidden\">\n      <div style=\"position:absolute;inset:0;background:radial-gradient(600px 340px at 100% 0%, rgba(79,168,228,0.3), transparent 62%)\"><\u002Fdiv>\n      <div style=\"position:relative\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:8px\">\n          <span style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#8CCB72;font-weight:500\">AFTER<\u002Fspan><span style=\"height:1px;flex:1;background:rgba(255,255,255,0.16)\"><\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-size:20px;font-weight:700;margin:0 0 22px;letter-spacing:-0.01em\">One governed pipeline<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column\">\n          <div style=\"border:1px solid rgba(140,203,114,0.35);background:rgba(140,203,114,0.08);border-radius:10px;padding:14px 16px;display:flex;gap:14px\"><span style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;color:#8CCB72\">01<\u002Fspan><div><div style=\"font-size:15px;font-weight:600\">Scoped business problem<\u002Fdiv><div style=\"font-size:13.5px;color:#A7BDCB;margin-top:3px\">Named owner, measurable outcome, agreed baseline.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"width:1px;height:12px;background:rgba(140,203,114,0.4);margin-left:30px\"><\u002Fdiv>\n          <div style=\"border:1px solid rgba(140,203,114,0.35);background:rgba(140,203,114,0.08);border-radius:10px;padding:14px 16px;display:flex;gap:14px\"><span style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;color:#8CCB72\">02<\u002Fspan><div><div style=\"font-size:15px;font-weight:600\">Governed data access<\u002Fdiv><div style=\"font-size:13.5px;color:#A7BDCB;margin-top:3px\">Permissions and lineage handled in the pipeline.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"width:1px;height:12px;background:rgba(140,203,114,0.4);margin-left:30px\"><\u002Fdiv>\n          <div style=\"border:1px solid rgba(140,203,114,0.35);background:rgba(140,203,114,0.08);border-radius:10px;padding:14px 16px;display:flex;gap:14px\"><span style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;color:#8CCB72\">03<\u002Fspan><div><div style=\"font-size:15px;font-weight:600\">Agent in the real workflow<\u002Fdiv><div style=\"font-size:13.5px;color:#A7BDCB;margin-top:3px\">Integrated where the work already happens.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"width:1px;height:12px;background:rgba(140,203,114,0.4);margin-left:30px\"><\u002Fdiv>\n          <div style=\"border:1px solid rgba(140,203,114,0.35);background:rgba(140,203,114,0.08);border-radius:10px;padding:14px 16px;display:flex;gap:14px\"><span style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;color:#8CCB72\">04<\u002Fspan><div><div style=\"font-size:15px;font-weight:600\">Evaluation as a gate<\u002Fdiv><div style=\"font-size:13.5px;color:#A7BDCB;margin-top:3px\">Regression caught before release, not after.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"width:1px;height:12px;background:rgba(140,203,114,0.4);margin-left:30px\"><\u002Fdiv>\n          <div style=\"border:1px solid rgba(140,203,114,0.55);background:rgba(140,203,114,0.14);border-radius:10px;padding:14px 16px;display:flex;gap:14px\"><span style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;color:#8CCB72\">05<\u002Fspan><div><div style=\"font-size:15px;font-weight:600\">Production, run by your team<\u002Fdiv><div style=\"font-size:13.5px;color:#D5E2EA;margin-top:3px\">CI/CD, monitoring, and engineers who own it.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-top:1px solid #10222E\">\n    <div style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#687987;padding:14px 0 4px\">FIVE PRACTICES, ONE BENCH<\u002Fdiv>\n    <a href=\"https://www.tekmentors.com/cloud-services-and-devops/\" style=\"display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:baseline;padding:22px 0;border-bottom:1px solid #DCE5EB;color:#10222E\" style-hover=\"color:#1B7CBE\">\n      <span style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;color:#687987\">01<\u002Fspan>\n      <div><div style=\"font-size:20px;font-weight:600;letter-spacing:-0.01em;margin-bottom:5px\">Cloud and DevOps<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:#4C5C69\">Pipelines that hold up under real load, and a bill you can explain at the end of the quarter.<\u002Fdiv><\u002Fdiv>\n      <span style=\"font-size:18px\">→<\u002Fspan>\n    <\u002Fa>\n    <a href=\"https://www.tekmentors.com/digital-transformation-and-tech-strategy/\" style=\"display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:baseline;padding:22px 0;border-bottom:1px solid #DCE5EB;color:#10222E\" style-hover=\"color:#1B7CBE\">\n      <span style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;color:#687987\">02<\u002Fspan>\n      <div><div style=\"font-size:20px;font-weight:600;letter-spacing:-0.01em;margin-bottom:5px\">Transformation and tech strategy<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:#4C5C69\">A roadmap tied to how the business makes money, with the legacy estate honestly accounted for.<\u002Fdiv><\u002Fdiv>\n      <span style=\"font-size:18px\">→<\u002Fspan>\n    <\u002Fa>\n    <a href=\"https://www.tekmentors.com/agile-transformation/\" style=\"display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:baseline;padding:22px 0;border-bottom:1px solid #DCE5EB;color:#10222E\" style-hover=\"color:#1B7CBE\">\n      <span style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;color:#687987\">03<\u002Fspan>\n      <div><div style=\"font-size:20px;font-weight:600;letter-spacing:-0.01em;margin-bottom:5px\">Agile transformation<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:#4C5C69\">Agile that survives contact with your org chart. Coaching for the teams, and for the managers above them.<\u002Fdiv><\u002Fdiv>\n      <span style=\"font-size:18px\">→<\u002Fspan>\n    <\u002Fa>\n    <a href=\"https://www.tekmentors.com/data-and-web-analytics-expertise/\" style=\"display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:baseline;padding:22px 0;border-bottom:1px solid #DCE5EB;color:#10222E\" style-hover=\"color:#1B7CBE\">\n      <span style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;color:#687987\">04<\u002Fspan>\n      <div><div style=\"font-size:20px;font-weight:600;letter-spacing:-0.01em;margin-bottom:5px\">Data and web analytics<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:#4C5C69\">Instrumentation you can trust on Adobe and Google stacks, so the next argument is about strategy rather than the numbers.<\u002Fdiv><\u002Fdiv>\n      <span style=\"font-size:18px\">→<\u002Fspan>\n    <\u002Fa>\n    <a href=\"#programs\" style=\"display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:baseline;padding:22px 0;border-bottom:1px solid #DCE5EB;color:#10222E\" style-hover=\"color:#1B7CBE\">\n      <span style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;color:#687987\">05<\u002Fspan>\n      <div><div style=\"font-size:20px;font-weight:600;letter-spacing:-0.01em;margin-bottom:5px\">Upskilling<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:#4C5C69\">Hands-on programs that leave your team able to build the thing without us.<\u002Fdiv><\u002Fdiv>\n      <span style=\"font-size:18px\">→<\u002Fspan>\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"how\" data-screen-label=\"How we work\" style=\"max-width:1480px;margin:0 auto;padding:clamp(48px,7vw,88px) clamp(18px,3vw,32px) 24px;scroll-margin-top:90px\">\n  <div style=\"max-width:700px;margin-bottom:40px\">\n    <div style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:0.14em;color:#1B7CBE;margin-bottom:16px\">HOW AN ENGAGEMENT RUNS<\u002Fdiv>\n    <h2 style=\"font-size:clamp(30px,3.6vw,46px);font-weight:700;letter-spacing:-0.025em;line-height:1.08;margin:0;text-wrap:pretty\">Four phases. Each one ends in something you can open.<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:1px;background:#DCE5EB;border:1px solid #DCE5EB;border-radius:14px;overflow:hidden\">\n    <div style=\"background:#fff;padding:30px 26px 32px;display:flex;flex-direction:column;min-height:230px\">\n      <div style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#687987;margin-bottom:18px\">PHASE 01<\u002Fdiv>\n      <h3 style=\"font-size:19px;font-weight:700;margin:0 0 10px;letter-spacing:-0.01em\">Scope, then argue<\u002Fh3>\n      <p style=\"font-size:14.5px;line-height:1.6;color:#4C5C69;margin:0 0 20px;text-wrap:pretty\">We interview the people doing the work, size the problem, and drop the ideas that do not survive the conversation.<\u002Fp>\n      <div style=\"margin-top:auto;font-size:13.5px;font-weight:600;border-top:1px solid #E7EDF2;padding-top:14px\">A scoped brief with a baseline number<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;padding:30px 26px 32px;display:flex;flex-direction:column;min-height:230px\">\n      <div style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#687987;margin-bottom:18px\">PHASE 02<\u002Fdiv>\n      <h3 style=\"font-size:19px;font-weight:700;margin:0 0 10px;letter-spacing:-0.01em\">Build against real data<\u002Fh3>\n      <p style=\"font-size:14.5px;line-height:1.6;color:#4C5C69;margin:0 0 20px;text-wrap:pretty\">Your documents, your permissions, your awkward integrations. The parts a vendor demo quietly skips.<\u002Fp>\n      <div style=\"margin-top:auto;font-size:13.5px;font-weight:600;border-top:1px solid #E7EDF2;padding-top:14px\">A working service, not a slide<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;padding:30px 26px 32px;display:flex;flex-direction:column;min-height:230px\">\n      <div style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#687987;margin-bottom:18px\">PHASE 03<\u002Fdiv>\n      <h3 style=\"font-size:19px;font-weight:700;margin:0 0 10px;letter-spacing:-0.01em\">Measure and guard<\u002Fh3>\n      <p style=\"font-size:14.5px;line-height:1.6;color:#4C5C69;margin:0 0 20px;text-wrap:pretty\">Evaluation set, regression runs, and the security posture written down where your risk team can read it.<\u002Fp>\n      <div style=\"margin-top:auto;font-size:13.5px;font-weight:600;border-top:1px solid #E7EDF2;padding-top:14px\">An eval harness and a report<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#07253C;color:#fff;padding:30px 26px 32px;display:flex;flex-direction:column;min-height:230px\">\n      <div style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#8CCB72;margin-bottom:18px\">PHASE 04<\u002Fdiv>\n      <h3 style=\"font-size:19px;font-weight:700;margin:0 0 10px;letter-spacing:-0.01em\">Hand it over properly<\u002Fh3>\n      <p style=\"font-size:14.5px;line-height:1.6;color:#A7BDCB;margin:0 0 20px;text-wrap:pretty\">Deployed with CI/CD and monitoring, documented, and walked through with the engineers who will own it.<\u002Fp>\n      <div style=\"margin-top:auto;font-size:13.5px;font-weight:600;border-top:1px solid rgba(255,255,255,0.2);padding-top:14px\">A live system with a named owner<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"answers\" data-screen-label=\"Answers\" style=\"max-width:1480px;margin:0 auto;padding:clamp(48px,7vw,88px) clamp(18px,3vw,32px) 24px;scroll-margin-top:90px\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:40px 64px;align-items:end;margin-bottom:44px\">\n    <div>\n      <div style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:0.14em;color:#1B7CBE;margin-bottom:16px\">STRAIGHT ANSWERS<\u002Fdiv>\n      <h2 style=\"font-size:clamp(30px,3.6vw,46px);font-weight:700;letter-spacing:-0.025em;line-height:1.08;margin:0;text-wrap:pretty\">The questions we get in almost every first meeting.<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"font-size:16.5px;line-height:1.6;color:#4C5C69;margin:0;max-width:520px;text-wrap:pretty\">Answered the way we would across a table, without the hedging. If yours is missing, it is probably the interesting one, so put it in the form.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:0 56px\">\n    <div style=\"border-top:1px solid #10222E;padding:26px 0 30px\">\n      <h3 style=\"font-size:20px;font-weight:700;letter-spacing:-0.01em;line-height:1.25;margin:0 0 12px\">Where should we actually start with AI?<\u002Fh3>\n      <p style=\"font-size:15.5px;line-height:1.65;color:#4C5C69;margin:0;text-wrap:pretty\">With the process your best people complain about most. It is usually unglamorous, already has a number attached, and nobody has offered to fix it because it is boring. That is exactly why it is the right first project.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #DCE5EB;padding:26px 0 30px\">\n      <h3 style=\"font-size:20px;font-weight:700;letter-spacing:-0.01em;line-height:1.25;margin:0 0 12px\">Our pilot works. Why can it not go live?<\u002Fh3>\n      <p style=\"font-size:15.5px;line-height:1.65;color:#4C5C69;margin:0;text-wrap:pretty\">Because a pilot proves the model and production needs everything else: governed data access, an evaluation set, a deployment path, monitoring, and a named owner on Monday morning. We build those in from week one.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #DCE5EB;padding:26px 0 30px\">\n      <h3 style=\"font-size:20px;font-weight:700;letter-spacing:-0.01em;line-height:1.25;margin:0 0 12px\">Do we hire AI engineers or train ours?<\u002Fh3>\n      <p style=\"font-size:15.5px;line-height:1.65;color:#4C5C69;margin:0;text-wrap:pretty\">Train the ones who already know your systems, your data and who to call when something breaks at nine on a Friday. That knowledge takes years to rebuild. The AI part takes weeks, and that is the part we teach.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #DCE5EB;padding:26px 0 30px\">\n      <h3 style=\"font-size:20px;font-weight:700;letter-spacing:-0.01em;line-height:1.25;margin:0 0 12px\">What does the first conversation cost?<\u002Fh3>\n      <p style=\"font-size:15.5px;line-height:1.65;color:#4C5C69;margin:0;text-wrap:pretty\">Nothing, including the one page recommendation that follows it. It is the fastest way for both sides to find out whether the work is a fit, and you keep the page either way.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #DCE5EB;padding:26px 0 30px\">\n      <h3 style=\"font-size:20px;font-weight:700;letter-spacing:-0.01em;line-height:1.25;margin:0 0 12px\">Can you work inside our security rules?<\u002Fh3>\n      <p style=\"font-size:15.5px;line-height:1.65;color:#4C5C69;margin:0;text-wrap:pretty\">Yes, and we would rather meet your risk and security people in week one than week six. We will sign your NDA before the scoping session if that is easier. Remote, on site in Delhi NCR, or a mix.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #DCE5EB;padding:26px 0 30px\">\n      <h3 style=\"font-size:20px;font-weight:700;letter-spacing:-0.01em;line-height:1.25;margin:0 0 12px\">What happens when you leave?<\u002Fh3>\n      <p style=\"font-size:15.5px;line-height:1.65;color:#4C5C69;margin:0;text-wrap:pretty\">Your engineers keep running it, because they built most of it with us watching rather than the other way round. Handover is a phase with a date on it, not a conversation we have when the invoice is due.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"record\" data-screen-label=\"Record\" style=\"max-width:1480px;margin:0 auto;padding:72px 32px 24px\">\n  <div style=\"background:#fff;border:1px solid #DCE5EB;border-radius:14px;padding:38px 36px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:32px\">\n      <div><div style=\"font-size:42px;font-weight:800;letter-spacing:-0.03em\">50<span style=\"color:#4A8F3C\">+<\u002Fspan><\u002Fdiv><div style=\"font-size:14px;color:#4C5C69;margin-top:6px\">Clients served<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:42px;font-weight:800;letter-spacing:-0.03em\">30<span style=\"color:#4A8F3C\">+<\u002Fspan><\u002Fdiv><div style=\"font-size:14px;color:#4C5C69;margin-top:6px\">Transformations delivered<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:42px;font-weight:800;letter-spacing:-0.03em\">100<span style=\"color:#4A8F3C\">+<\u002Fspan><\u002Fdiv><div style=\"font-size:14px;color:#4C5C69;margin-top:6px\">Programs taught<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:42px;font-weight:800;letter-spacing:-0.03em\">10<span style=\"color:#4A8F3C\">+<\u002Fspan><\u002Fdiv><div style=\"font-size:14px;color:#4C5C69;margin-top:6px\">Awards won<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ showOpenSlots }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"border-top:1px solid #E7EDF2;margin-top:30px;padding-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px\">\n        <div style=\"border:1px dashed #C4D2DC;border-radius:12px;padding:22px\">\n          <div style=\"font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:0.1em;color:#5A6B78;margin-bottom:10px\">ONE CASE RECORD<\u002Fdiv>\n          <p style=\"font-size:14.5px;line-height:1.6;color:#4C5C69;margin:0\">Baseline, what we did, result. One client-approved figure beats any number of adjectives.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px dashed #C4D2DC;border-radius:12px;padding:22px\">\n          <div style=\"font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:0.1em;color:#5A6B78;margin-bottom:10px\">THREE NAMED MENTORS<\u002Fdiv>\n          <p style=\"font-size:14.5px;line-height:1.6;color:#4C5C69;margin:0\">Names, titles, employers and LinkedIn profiles. Senior people look up who is in the room before they commit.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px dashed #C4D2DC;border-radius:12px;padding:22px\">\n          <div style=\"font-family:'Spline Sans Mono',monospace;font-size:10.5px;letter-spacing:0.1em;color:#5A6B78;margin-bottom:10px\">ONE CLIENT QUOTE<\u002Fdiv>\n          <p style=\"font-size:14.5px;line-height:1.6;color:#4C5C69;margin:0\">Two sentences from a named client with their title. It will do more for enquiries than anything else on this page.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"insights\" data-screen-label=\"Insights\" style=\"max-width:1480px;margin:0 auto;padding:72px 32px 24px;scroll-margin-top:90px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:28px\">\n    <h2 style=\"font-size:clamp(26px,3vw,36px);font-weight:700;letter-spacing:-0.025em;line-height:1.1;margin:0\">What we have been writing about.<\u002Fh2>\n    <a href=\"https://www.tekmentors.com/blog/\" style=\"font-size:15px;font-weight:600;color:#10222E;border-bottom:1.5px solid #10222E;padding-bottom:2px\" style-hover=\"color:#1B7CBE;border-bottom-color:#1B7CBE\">Everything on the blog →<\u002Fa>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid #10222E\">\n    <a href=\"https://www.tekmentors.com/from-data-silos-to-business-agility-how-financial-leaders-turn-information-into-competitive-advantage/\" style=\"display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr) auto;gap:28px;align-items:baseline;padding:22px 0;border-bottom:1px solid #DCE5EB;color:#10222E\" style-hover=\"color:#1B7CBE\">\n      <span style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.1em;color:#687987\">DATA AND AGILITY<\u002Fspan>\n      <span style=\"font-size:18px;font-weight:600;line-height:1.35;letter-spacing:-0.01em;text-wrap:pretty\">From data silos to business agility: how financial leaders turn information into competitive advantage<\u002Fspan>\n      <span style=\"font-size:18px\">→<\u002Fspan>\n    <\u002Fa>\n    <a href=\"https://www.tekmentors.com/5-critical-success-factors-for-financial-services-leaders/\" style=\"display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr) auto;gap:28px;align-items:baseline;padding:22px 0;border-bottom:1px solid #DCE5EB;color:#10222E\" style-hover=\"color:#1B7CBE\">\n      <span style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.1em;color:#687987\">TRANSFORMATION<\u002Fspan>\n      <span style=\"font-size:18px;font-weight:600;line-height:1.35;letter-spacing:-0.01em;text-wrap:pretty\">Why 70% of digital transformation projects fail: five critical success factors for financial services leaders<\u002Fspan>\n      <span style=\"font-size:18px\">→<\u002Fspan>\n    <\u002Fa>\n    <a href=\"https://www.tekmentors.com/the-hidden-costs-of-cloud-migration-7-critical-pitfalls-financial-services-leaders-must-avoid/\" style=\"display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr) auto;gap:28px;align-items:baseline;padding:22px 0;border-bottom:1px solid #DCE5EB;color:#10222E\" style-hover=\"color:#1B7CBE\">\n      <span style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.1em;color:#687987\">CLOUD<\u002Fspan>\n      <span style=\"font-size:18px;font-weight:600;line-height:1.35;letter-spacing:-0.01em;text-wrap:pretty\">The hidden costs of cloud migration: seven pitfalls financial services leaders must avoid<\u002Fspan>\n      <span style=\"font-size:18px\">→<\u002Fspan>\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" data-screen-label=\"Contact\" style=\"margin-top:80px;background:#07253C;color:#fff;position:relative;overflow:hidden;scroll-margin-top:74px\">\n  <div style=\"position:absolute;inset:0;background:radial-gradient(900px 460px at 90% 110%, rgba(79,168,228,0.3), transparent 64%)\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1480px;margin:0 auto;padding:clamp(48px,7vw,88px) clamp(18px,3vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:56px 72px;align-items:start\">\n    <div>\n      <div style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:0.14em;color:#8CCB72;margin-bottom:16px\">TALK TO US<\u002Fdiv>\n      <h2 style=\"font-size:clamp(32px,3.8vw,50px);font-weight:700;letter-spacing:-0.025em;line-height:1.06;margin:0 0 18px;text-wrap:pretty\">Bring us the problem you have stopped mentioning in meetings.<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.6;color:#A7BDCB;margin:0 0 40px;max-width:520px;text-wrap:pretty\">Nobody likes sending a form into the dark, so here is exactly what follows. You can stop at any step without an awkward phone call.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column\">\n        <div style=\"display:grid;grid-template-columns:minmax(100px,150px) minmax(0,1fr);gap:16px 20px;padding:18px 0;border-top:1px solid rgba(255,255,255,0.14)\">\n          <span style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.1em;color:#8CCB72;padding-top:4px\">WITHIN 1 DAY<\u002Fspan>\n          <div><div style=\"font-size:16.5px;font-weight:600;margin-bottom:4px\">A real reply<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:#A7BDCB\">From the consultant who will handle it, with their name and two or three questions about what you sent.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(100px,150px) minmax(0,1fr);gap:16px 20px;padding:18px 0;border-top:1px solid rgba(255,255,255,0.14)\">\n          <span style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.1em;color:#8CCB72;padding-top:4px\">DAY 2 TO 4<\u002Fspan>\n          <div><div style=\"font-size:16.5px;font-weight:600;margin-bottom:4px\">A 45 minute session<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:#A7BDCB\">Bring the engineers. We ask questions and take notes rather than present.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(100px,150px) minmax(0,1fr);gap:16px 20px;padding:18px 0;border-top:1px solid rgba(255,255,255,0.14)\">\n          <span style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.1em;color:#8CCB72;padding-top:4px\">2 DAYS LATER<\u002Fspan>\n          <div><div style=\"font-size:16.5px;font-weight:600;margin-bottom:4px\">A one page recommendation<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:#A7BDCB\">What we heard, what we would do first, what it would take. Yours to keep and circulate.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(100px,150px) minmax(0,1fr);gap:16px 20px;padding:18px 0;border-top:1px solid rgba(255,255,255,0.14);border-bottom:1px solid rgba(255,255,255,0.14)\">\n          <span style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.1em;color:#8CCB72;padding-top:4px\">IF YOU WANT IT<\u002Fspan>\n          <div><div style=\"font-size:16.5px;font-weight:600;margin-bottom:4px\">A proposal<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:#A7BDCB\">Scope, team, timeline and cost on one page. If the recommendation was enough on its own, that is fine too.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:28px;display:flex;gap:22px;flex-wrap:wrap;font-size:15px\">\n        <a href=\"tel:+919958777467\" style=\"color:#fff;border-bottom:1px solid rgba(255,255,255,0.3);padding-bottom:3px\" style-hover=\"color:#4FA8E4\">+91 99587 77467<\u002Fa>\n        <a href=\"mailto:info@tekmentors.com\" style=\"color:#fff;border-bottom:1px solid rgba(255,255,255,0.3);padding-bottom:3px\" style-hover=\"color:#4FA8E4\">info@tekmentors.com<\u002Fa>\n        <a href=\"https://www.linkedin.com/company/tekmentors/\" style=\"color:#fff;border-bottom:1px solid rgba(255,255,255,0.3);padding-bottom:3px\" style-hover=\"color:#4FA8E4\">LinkedIn<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"form\" style=\"width:100%;max-width:500px;margin-inline:auto;scroll-margin-top:98px\">\n      <div style=\"background:#fff;color:#10222E;border-radius:14px;box-shadow:0 24px 60px -30px rgba(0,0,0,0.5);overflow:hidden\">\n        <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:44px 34px 40px;text-align:center\">\n            <div style=\"width:52px;height:52px;border-radius:99px;background:#EAF6E6;color:#3C7A31;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin:0 auto 20px\">✓<\u002Fdiv>\n            <h3 style=\"font-size:24px;font-weight:700;letter-spacing:-0.02em;margin:0 0 12px\">Got it. Thank you.<\u002Fh3>\n            <p style=\"font-size:15.5px;line-height:1.6;color:#4C5C69;margin:0 0 24px\">A consultant is reading it today. You will have a reply within one working day, from a person with a name.<\u002Fp>\n            <div style=\"text-align:left;background:#F7FAFC;border:1px solid #DCE5EB;border-radius:10px;padding:20px 22px;margin-bottom:22px\">\n              <div style=\"font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#687987;margin-bottom:12px\">WHILE YOU WAIT<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14.5px\">\n                <a href=\"#programs\" style=\"color:#175F91\">Look at the three programs<\u002Fa>\n                <a href=\"#answers\" style=\"color:#175F91\">Read the straight answers<\u002Fa>\n                <a href=\"https://www.tekmentors.com/case-studies/\" style=\"color:#175F91\">Browse the case studies<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ reset }}\" style=\"background:none;border:0;color:#687987;font-size:14px;cursor:pointer;text-decoration:underline\">Send another enquiry<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding:30px 34px 32px\">\n          <h3 style=\"font-size:23px;font-weight:700;letter-spacing:-0.02em;margin:0 0 8px\">Tell us what you need<\u002Fh3>\n          <p style=\"font-size:14.5px;line-height:1.55;color:#4C5C69;margin:0 0 22px\">Four fields, about a minute. It goes straight to the consulting team.<\u002Fp>\n          <div style=\"margin-bottom:18px\">\n            <label style=\"display:block;font-size:13px;font-weight:600;color:#24404F;margin-bottom:9px\">What is this about?<\u002Flabel>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n              <button sc-camel-on-click=\"{{ pickConsulting }}\" style=\"text-align:left;padding:12px 14px;border-radius:9px;border:1.5px solid {{ needConsultingBorder }};background:{{ needConsultingBg }};cursor:pointer;font-size:14px;font-weight:600;color:#10222E\">A project or system<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ pickTraining }}\" style=\"text-align:left;padding:12px 14px;border-radius:9px;border:1.5px solid {{ needTrainingBorder }};background:{{ needTrainingBg }};cursor:pointer;font-size:14px;font-weight:600;color:#10222E\">Training my team<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ pickHiring }}\" style=\"text-align:left;padding:12px 14px;border-radius:9px;border:1.5px solid {{ needHiringBorder }};background:{{ needHiringBg }};cursor:pointer;font-size:14px;font-weight:600;color:#10222E\">Joining a program<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ pickUnsure }}\" style=\"text-align:left;padding:12px 14px;border-radius:9px;border:1.5px solid {{ needUnsureBorder }};background:{{ needUnsureBg }};cursor:pointer;font-size:14px;font-weight:600;color:#10222E\">Not sure yet<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div>\n              <label for=\"v4name\" style=\"display:block;font-size:13px;font-weight:600;color:#24404F;margin-bottom:7px\">Your name<\u002Flabel>\n              <input id=\"v4name\" type=\"text\" value=\"{{ name }}\" sc-camel-on-change=\"{{ onName }}\" placeholder=\"Priya Nair\" style=\"width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #D8E0E6;border-radius:9px;font-size:15px;color:#10222E;background:#fff\">\n            <\u002Fdiv>\n            <div>\n              <label for=\"v4email\" style=\"display:block;font-size:13px;font-weight:600;color:#24404F;margin-bottom:7px\">Work email<\u002Flabel>\n              <input id=\"v4email\" type=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"priya@company.com\" style=\"width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #D8E0E6;border-radius:9px;font-size:15px;color:#10222E;background:#fff\">\n            <\u002Fdiv>\n            <div>\n              <label for=\"v4org\" style=\"display:block;font-size:13px;font-weight:600;color:#24404F;margin-bottom:7px\">Company <span style=\"color:#687987;font-weight:400\">(optional)<\u002Fspan><\u002Flabel>\n              <input id=\"v4org\" type=\"text\" value=\"{{ org }}\" sc-camel-on-change=\"{{ onOrg }}\" placeholder=\"Where you work\" style=\"width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #D8E0E6;border-radius:9px;font-size:15px;color:#10222E;background:#fff\">\n            <\u002Fdiv>\n            <div>\n              <label for=\"v4msg\" style=\"display:block;font-size:13px;font-weight:600;color:#24404F;margin-bottom:7px\">What is stuck?<\u002Flabel>\n              <textarea id=\"v4msg\" rows=\"3\" value=\"{{ msg }}\" sc-camel-on-change=\"{{ onMsg }}\" placeholder=\"One or two lines is plenty. Plain language beats a spec.\" style=\"width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #D8E0E6;border-radius:9px;font-size:15px;line-height:1.5;color:#10222E;background:#fff;resize:vertical\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:14px;background:#FDF3F1;border:1px solid #EBD0C9;color:#8A3B26;font-size:13.5px;padding:11px 14px;border-radius:9px\">{{ error }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ submit }}\" style=\"width:100%;margin-top:20px;background:#1B7CBE;color:#fff;border:0;padding:16px;border-radius:9px;font-size:16px;font-weight:700;cursor:pointer;transition:background 0.2s ease\" style-hover=\"background:#10222E\">Send it to the team<\u002Fbutton>\n          <p style=\"font-size:12.5px;line-height:1.5;color:#687987;margin:14px 0 0;text-align:center\">Your details go to our consultants and nowhere else. No newsletter, no automated sequence, no third parties.<\u002Fp>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer data-screen-label=\"Footer\" style=\"background:#F5F8FA;border-top:1px solid #DCE5EB\">\n  <div style=\"max-width:1480px;margin:0 auto;padding:56px 32px 32px;display:grid;grid-template-column    const { name, email, msg } = this.state;\n    if (!name.trim()) return this.setState({ error: 'We need a name to reply to.' });\n    if (!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(email.trim())) return this.setState({ error: 'That email does not look right. Check it and send again.' });\n    if (msg.trim().length < 8) return this.setState({ error: 'A line or two about what is stuck helps us route this properly.' });\n    this.setState({ sent: true });\n  }\n\n  chip(active) { return { border: active ? '#1B7CBE' : '#D8E0E6', bg: active ? '#EAF4FB' : '#fff' }; }\n\n  renderVals() {\n    const s = this.state;\n    const c = n => this.chip(s.need === n);\n    const consulting = c('A project or system'), training = c('Training my team'),\n          hiring = c('Joining a program'), unsure = c('Not sure yet');\n    return {\n      sent: s.sent, notSent: !s.sent,\n      name: s.name, email: s.email, org: s.org, msg: s.msg,\n      error: s.error, hasError: !!s.error,\n      onName: this.set('name'), onEmail: this.set('email'), onOrg: this.set('org'), onMsg: this.set('msg'),\n      submit: () => this.submit(),\n      reset: () => this.setState({ sent: false, name: '', email: '', org: '', msg: '', error: '' }),\n      pickConsulting: () => this.setState({ need: 'A project or system' }),\n      pickTraining: () => this.setState({ need: 'Training my team' }),\n      pickHiring: () => this.setState({ need: 'Joining a program' }),\n      pickUnsure: () => this.setState({ need: 'Not sure yet' }),\n      needConsultingBorder: consulting.border, needConsultingBg: consulting.bg,\n      needTrainingBorder: training.border, needTrainingBg: training.bg,\n      needHiringBorder: hiring.border, needHiringBg: hiring.bg,\n      needUnsureBorder: unsure.border, needUnsureBg: unsure.bg,\n      showOpenSlots: this.props.showOpenSlots ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
